name: CI Governance Template

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  governance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex capability gate
        run: bash scripts/ci/check-codex-capabilities.sh

      - name: Prepare governance metadata
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .ci
          printf '%s\n' "$PR_BODY" > .ci/pr_body.md

      - name: Collect changed files
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > .ci/changed_files.txt

      - name: Export changed files
        run: |
          if [ -s .ci/changed_files.txt ]; then
            echo "CHANGED_FILES<<EOF" >> "$GITHUB_ENV"
            cat .ci/changed_files.txt >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          fi

      - name: Run spec pack gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-spec-pack.sh

      - name: Run spec quality gate
        run: bash scripts/ci/validate-spec-quality.sh

      - name: Run citation quality gate
        run: bash scripts/ci/validate-citation-quality.sh

      - name: Run role flow gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-role-flow.sh

      - name: Run standards binding gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-standards-binding.sh

      - name: Run API/Frontend sync gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-api-frontend-sync.sh

      - name: Run exception gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-exception-gate.sh

      - name: Run permissions gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-permissions-gate.sh

      - name: Run security gate
        run: bash scripts/ci/validate-security-gate.sh

      - name: Run governance gate
        env:
          PR_BODY_FILE: .ci/pr_body.md
        run: bash scripts/ci/validate-governance.sh

      - name: Run release readiness gate
        run: bash scripts/ci/validate-release-readiness.sh

      - name: Run observability gate (warn mode)
        env:
          OBS_ENFORCEMENT: warn
        run: bash scripts/ci/validate-observability-gate.sh

      - name: Run doc link gate
        run: bash scripts/ci/validate-doc-links.sh
